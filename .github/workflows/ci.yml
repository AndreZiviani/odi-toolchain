name: ci

# Pushes to main and pull requests: lint, build the freestanding image, and
# run the ISA audit self-test in it. The uclibc image is not built here -- it
# takes about an hour -- but a pull request that touches uclibc/ can be
# checked with workflow_dispatch.
#
# A tag publishes one image:
#
#     uclibc-v<N>            ghcr.io/andreziviani/odi-toolchain-uclibc:v<N>              linux/amd64
#     freestanding-v<N>      ghcr.io/andreziviani/odi-toolchain-freestanding:v<N>        linux/amd64, linux/arm64
#     qemu-malta-v<N>        ghcr.io/andreziviani/odi-toolchain-qemu-kernel-malta:v<N>   linux/amd64
#
# Consumers pin the DIGEST printed in the job summary, never the tag: a tag
# can be moved, a digest cannot. The workflow authenticates with the
# GITHUB_TOKEN of this repository; pulling needs no token once the packages
# are public.
on:
  push:
    branches: [main]
    tags: ['uclibc-v*', 'freestanding-v*', 'qemu-malta-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      uclibc:
        description: also build the uclibc image (about an hour), without pushing it
        type: boolean
        default: false
      qemu_kernel:
        description: also build the qemu-kernel-malta image (about ten minutes), without pushing it
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/andreziviani

jobs:
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG entry for non-docs changes
        run: |
          if printf "%s\n" "${{ join(github.event.pull_request.labels.*.name, ' ') }}" | grep -qw no-changelog; then
            echo "changelog: no-changelog label set, skipping"
            exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          # docs-only/CI-only paths: markdown files, the license, and workflow
          # files under .github/. Anything else counts as user- or build-facing.
          non_docs=$(printf "%s\n" "$changed" | grep -Ev '\.md$|^LICENSE$|^\.github/' || true)
          if [ -z "$non_docs" ]; then
            echo "changelog: docs-only or CI-only change, skipping"
            exit 0
          fi
          if ! printf "%s\n" "$changed" | grep -qx "CHANGELOG.md"; then
            echo "::error::this PR changes $(printf '%s' "$non_docs" | tr '\n' ' ') but does not touch CHANGELOG.md -- add an entry under Unreleased, or apply the no-changelog label"
            exit 1
          fi
          echo "changelog: entry present"

  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          make lint

      - name: Build the freestanding image and run the ISA self-test
        run: make test

  uclibc-check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.uclibc }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Build the uclibc image (not pushed)
        run: make uclibc JOBS=$(nproc)

  qemu-kernel-check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qemu_kernel }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the qemu-kernel-malta image (not pushed)
        run: make qemu-kernel-malta JOBS=$(nproc)
      - name: Boot smoke test -- odi-oss out/busybox as init, look for a marker line
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-mips cpio
          id=$(docker create odi-toolchain-qemu-kernel-malta:local)
          docker cp "$id":/boot/vmlinux ./vmlinux
          docker rm "$id"
          mkdir -p initramfs/bin
          # A static, big-endian MIPS busybox is enough to prove the kernel
          # boots and runs odi-oss-shaped userland; it does not have to be
          # odi-oss's own build, which this workflow does not have.
          curl -fsSL -o initramfs/bin/busybox \
            https://busybox.net/downloads/binaries/1.35.0-mipseb-linux-musl/busybox
          chmod +x initramfs/bin/busybox
          printf '#!/bin/busybox sh\n/bin/busybox --install -s /bin\necho QEMU-KERNEL-MALTA-BOOT-OK\npoweroff -f\n' > initramfs/init
          chmod +x initramfs/init
          ( cd initramfs && find . | cpio -o -H newc | gzip ) > initramfs.cpio.gz
          timeout 60 qemu-system-mips -M malta -kernel vmlinux -initrd initramfs.cpio.gz \
            -append "console=ttyS0 rdinit=/init" -m 64M -nographic -no-reboot | tee boot.log || true
          grep -q QEMU-KERNEL-MALTA-BOOT-OK boot.log

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Which image
        id: which
        run: |
          tag=${GITHUB_REF#refs/tags/}
          # tag_prefix is the tag family; flavour is the Dockerfile
          # directory AND the image name suffix -- the two differ for the
          # qemu kernel (tag qemu-malta-vN, directory/image qemu-kernel-malta,
          # the same short name the tag family already uses for what board
          # it targets).
          case $tag in
          uclibc-v*)       tag_prefix=uclibc;       flavour=uclibc;            platforms=linux/amd64 ;;
          freestanding-v*) tag_prefix=freestanding; flavour=freestanding;      platforms=linux/amd64,linux/arm64 ;;
          qemu-malta-v*)   tag_prefix=qemu-malta;    flavour=qemu-kernel-malta; platforms=linux/amd64 ;;
          *) echo "::error::unknown tag $tag"; exit 1 ;;
          esac
          ver=${tag#"$tag_prefix"-}
          {
            echo "flavour=$flavour"
            echo "platforms=$platforms"
            echo "image=$REGISTRY/odi-toolchain-$flavour"
            echo "ver=$ver"
          } >> "$GITHUB_OUTPUT"

      # The gcc build tree is several GB; the hosted runner has room, but not
      # much to spare once the preinstalled SDKs are counted.
      - name: Free disk space
        if: steps.which.outputs.flavour == 'uclibc'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Lint and self-test first
        if: steps.which.outputs.flavour == 'freestanding'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          make lint
          make test

      - name: Lint first
        if: steps.which.outputs.flavour == 'qemu-kernel-malta'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          make lint

      - name: QEMU for the arm64 build
        if: contains(steps.which.outputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          docker buildx create --use --name odi >/dev/null
          docker buildx build --progress=plain \
            --platform "${{ steps.which.outputs.platforms }}" \
            --build-arg JOBS="$(nproc)" \
            -f "${{ steps.which.outputs.flavour }}/Dockerfile" \
            -t "${{ steps.which.outputs.image }}:${{ steps.which.outputs.ver }}" \
            --label "org.opencontainers.image.version=${{ steps.which.outputs.ver }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --metadata-file meta.json \
            --push .
          digest=$(python3 -c 'import json; print(json.load(open("meta.json"))["containerimage.digest"])')
          ref="${{ steps.which.outputs.image }}:${{ steps.which.outputs.ver }}@$digest"
          echo "published $ref"
          {
            echo "### Published"
            echo
            echo '```'
            echo "$ref"
            echo '```'
            echo
            echo "Pin it by digest in the consumers."
          } >> "$GITHUB_STEP_SUMMARY"

      # The uclibc image has only been audited while it was being built; this
      # runs the self-test against what was actually pushed.
      - name: Check the pushed image
        run: |
          img="${{ steps.which.outputs.image }}:${{ steps.which.outputs.ver }}"
          docker pull --platform linux/amd64 "$img"
          case "${{ steps.which.outputs.flavour }}" in
          uclibc)
            docker run --rm "$img" sh -c 'mips-linux-uclibc-gcc --version | head -1 && odi-audit-libs'
            ;;
          freestanding)
            docker run --rm -v "$PWD":/t -w /t "$img" sh test/run.sh
            ;;
          qemu-kernel-malta)
            sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-mips cpio
            id=$(docker create --platform linux/amd64 "$img")
            docker cp "$id":/boot/vmlinux ./vmlinux
            docker rm "$id"
            mkdir -p initramfs/bin
            curl -fsSL -o initramfs/bin/busybox \
              https://busybox.net/downloads/binaries/1.35.0-mipseb-linux-musl/busybox
            chmod +x initramfs/bin/busybox
            printf '#!/bin/busybox sh\n/bin/busybox --install -s /bin\necho QEMU-KERNEL-MALTA-BOOT-OK\npoweroff -f\n' > initramfs/init
            chmod +x initramfs/init
            ( cd initramfs && find . | cpio -o -H newc | gzip ) > initramfs.cpio.gz
            timeout 60 qemu-system-mips -M malta -kernel vmlinux -initrd initramfs.cpio.gz \
              -append "console=ttyS0 rdinit=/init" -m 64M -nographic -no-reboot | tee boot.log || true
            grep -q QEMU-KERNEL-MALTA-BOOT-OK boot.log
            ;;
          esac
