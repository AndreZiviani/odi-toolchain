name: ci

# Pushes to main and pull requests: lint, build the freestanding image, and
# run the ISA audit self-test in it. The uclibc image is not built here -- it
# takes about an hour -- but a pull request that touches uclibc/ can be
# checked with workflow_dispatch.
#
# A tag publishes one image:
#
#     uclibc-v<N>            ghcr.io/andreziviani/odi-toolchain-uclibc:v<N>              linux/amd64
#     freestanding-v<N>      ghcr.io/andreziviani/odi-toolchain-freestanding:v<N>        linux/amd64, linux/arm64
#     qemu-malta-v<N>        ghcr.io/andreziviani/odi-toolchain-qemu-kernel-malta:v<N>   linux/amd64
#
# Consumers pin the DIGEST printed in the job summary, never the tag: a tag
# can be moved, a digest cannot. The workflow authenticates with the
# GITHUB_TOKEN of this repository; pulling needs no token once the packages
# are public.
on:
  push:
    branches: [main]
    tags: ['uclibc-v*', 'freestanding-v*', 'qemu-malta-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      uclibc:
        description: also build the uclibc image (about an hour), without pushing it
        type: boolean
        default: false
      qemu_kernel:
        description: also build the qemu-kernel-malta image (about ten minutes), without pushing it
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/andreziviani

jobs:
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG entry for non-docs changes
        run: |
          if printf "%s\n" "${{ join(github.event.pull_request.labels.*.name, ' ') }}" | grep -qw no-changelog; then
            echo "changelog: no-changelog label set, skipping"
            exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          # docs-only/CI-only paths: markdown files, the license, and workflow
          # files under .github/. Anything else counts as user- or build-facing.
          non_docs=$(printf "%s\n" "$changed" | grep -Ev '\.md$|^LICENSE$|^\.github/' || true)
          if [ -z "$non_docs" ]; then
            echo "changelog: docs-only or CI-only change, skipping"
            exit 0
          fi
          if ! printf "%s\n" "$changed" | grep -qx "CHANGELOG.md"; then
            echo "::error::this PR changes $(printf '%s' "$non_docs" | tr '\n' ' ') but does not touch CHANGELOG.md -- add an entry under Unreleased, or apply the no-changelog label"
            exit 1
          fi
          echo "changelog: entry present"

  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    # A good run takes a few minutes. Without a bound, apt waiting on a
    # half-down snapshot.debian.org held this job for GitHub's 6 h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          make lint

      - name: Build the freestanding image and run the ISA self-test
        run: make test

  # The same image built for arm64 on an arm64 runner, as a tag publishes
  # it: an arm64 build that breaks shows here, not first on a tag.
  check-arm64:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build the freestanding image and run the ISA self-test
        run: make test

  uclibc-check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.uclibc }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Build the uclibc image (not pushed)
        run: make uclibc JOBS=$(nproc)

  qemu-kernel-check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qemu_kernel }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the qemu-kernel-malta image (not pushed)
        run: make qemu-kernel-malta JOBS=$(nproc)
      - name: Boot smoke test -- no initramfs, so no odi-oss binary is needed here
        run: |
          # This workflow has no big-endian MIPS binary of its own to use as
          # init (odi-oss's own test-qemu, in the odi-oss repository, is
          # where the real rootfs actually boots and is checked end to end
          # over ssh/http). Booting with no initrd at all still proves the
          # kernel this image publishes runs correctly on qemu-system-mips
          # -M malta: it reaches the VFS root-mount step and panics for the
          # ordinary reason (no root device given), never earlier.
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-mips
          id=$(docker create odi-toolchain-qemu-kernel-malta:local)
          docker cp "$id":/boot/vmlinux ./vmlinux
          docker rm "$id"
          timeout 60 qemu-system-mips -M malta -kernel vmlinux \
            -append "console=ttyS0" -m 64M -nographic -no-reboot | tee boot.log || true
          grep -q "Unable to mount root fs" boot.log

  # One leg per architecture, each on a runner of that architecture, so no
  # image is built under QEMU emulation. freestanding-v4 was first built for
  # arm64 under QEMU on the amd64 runner, as v1 to v3 were; on the
  # ubuntu-26.04 runner image both arm64 RUN steps printed their header and
  # nothing more for 5.5 h, twice, until the job timed out (2026-11-05). A
  # leg pushes its image by digest only; the manifest job below joins the
  # legs under the version tag. A leg whose architecture the tag does not
  # publish stops after "Which image".
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Which image
        id: which
        run: |
          tag=${GITHUB_REF#refs/tags/}
          # tag_prefix is the tag family; flavour is the Dockerfile
          # directory AND the image name suffix -- the two differ for the
          # qemu kernel (tag qemu-malta-vN, directory/image qemu-kernel-malta,
          # the same short name the tag family already uses for what board
          # it targets).
          case $tag in
          uclibc-v*)       tag_prefix=uclibc;       flavour=uclibc;            platforms=linux/amd64 ;;
          freestanding-v*) tag_prefix=freestanding; flavour=freestanding;      platforms=linux/amd64,linux/arm64 ;;
          qemu-malta-v*)   tag_prefix=qemu-malta;    flavour=qemu-kernel-malta; platforms=linux/amd64 ;;
          *) echo "::error::unknown tag $tag"; exit 1 ;;
          esac
          ver=${tag#"$tag_prefix"-}
          {
            echo "flavour=$flavour"
            echo "platforms=$platforms"
            echo "image=$REGISTRY/odi-toolchain-$flavour"
            echo "ver=$ver"
            case ",$platforms," in
            *",linux/${{ matrix.arch }},"*) echo "build=1" ;;
            *) echo "build=0" ;;
            esac
          } >> "$GITHUB_OUTPUT"

      # The gcc build tree is several GB; the hosted runner has room, but not
      # much to spare once the preinstalled SDKs are counted.
      - name: Free disk space
        if: steps.which.outputs.flavour == 'uclibc' && steps.which.outputs.build == '1'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Lint and self-test first
        if: steps.which.outputs.flavour == 'freestanding' && matrix.arch == 'amd64'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          make lint
          make test

      - name: Lint first
        if: steps.which.outputs.flavour == 'qemu-kernel-malta' && matrix.arch == 'amd64'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          make lint

      - name: Log in to ghcr.io
        if: steps.which.outputs.build == '1'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push by digest
        if: steps.which.outputs.build == '1'
        run: |
          docker buildx create --use --name odi >/dev/null
          docker buildx build --progress=plain \
            --platform "linux/${{ matrix.arch }}" \
            --build-arg JOBS="$(nproc)" \
            -f "${{ steps.which.outputs.flavour }}/Dockerfile" \
            --label "org.opencontainers.image.version=${{ steps.which.outputs.ver }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --metadata-file meta.json \
            --output "type=image,name=${{ steps.which.outputs.image }},push-by-digest=true,name-canonical=true,push=true" .
          python3 -c 'import json; print(json.load(open("meta.json"))["containerimage.digest"])' > digest-${{ matrix.arch }}
          echo "${{ matrix.arch }}: $(cat digest-${{ matrix.arch }})"

      - name: Hand the digest to the manifest job
        if: steps.which.outputs.build == '1'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}
          retention-days: 1

  # The legs joined under the version tag, as one multi-architecture image.
  manifest:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Which image
        id: which
        run: |
          tag=${GITHUB_REF#refs/tags/}
          # tag_prefix is the tag family; flavour is the Dockerfile
          # directory AND the image name suffix -- the two differ for the
          # qemu kernel (tag qemu-malta-vN, directory/image qemu-kernel-malta,
          # the same short name the tag family already uses for what board
          # it targets).
          case $tag in
          uclibc-v*)       tag_prefix=uclibc;       flavour=uclibc;            platforms=linux/amd64 ;;
          freestanding-v*) tag_prefix=freestanding; flavour=freestanding;      platforms=linux/amd64,linux/arm64 ;;
          qemu-malta-v*)   tag_prefix=qemu-malta;    flavour=qemu-kernel-malta; platforms=linux/amd64 ;;
          *) echo "::error::unknown tag $tag"; exit 1 ;;
          esac
          ver=${tag#"$tag_prefix"-}
          {
            echo "flavour=$flavour"
            echo "platforms=$platforms"
            echo "image=$REGISTRY/odi-toolchain-$flavour"
            echo "ver=$ver"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag the legs
        run: |
          img="${{ steps.which.outputs.image }}"
          refs=""
          for p in $(echo "${{ steps.which.outputs.platforms }}" | tr , ' '); do
            f="digest-${p#linux/}"
            [ -s "$f" ] || { echo "::error::no digest for $p"; exit 1; }
            refs="$refs $img@$(cat "$f")"
          done
          # shellcheck disable=SC2086 # one reference per word
          docker buildx imagetools create -t "$img:${{ steps.which.outputs.ver }}" $refs
          digest=$(docker buildx imagetools inspect "$img:${{ steps.which.outputs.ver }}" --format '{{json .Manifest}}' |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          ref="$img:${{ steps.which.outputs.ver }}@$digest"
          echo "published $ref"
          {
            echo "### Published"
            echo
            echo '```'
            echo "$ref"
            echo '```'
            echo
            echo "Pin it by digest in the consumers."
          } >> "$GITHUB_STEP_SUMMARY"

      # The uclibc image has only been audited while it was being built; this
      # runs the self-test against what was actually pushed.
      - name: Check the pushed image
        run: |
          img="${{ steps.which.outputs.image }}:${{ steps.which.outputs.ver }}"
          docker pull --platform linux/amd64 "$img"
          case "${{ steps.which.outputs.flavour }}" in
          uclibc)
            docker run --rm "$img" sh -c 'mips-linux-uclibc-gcc --version | head -1 && odi-audit-libs'
            ;;
          freestanding)
            docker run --rm -v "$PWD":/t -w /t "$img" sh test/run.sh
            ;;
          qemu-kernel-malta)
            # No initramfs (see the qemu-kernel-check job for why): booting
            # with none still proves the published vmlinux runs on
            # qemu-system-mips -M malta, up to the ordinary panic for
            # having given it no root device.
            sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-mips
            id=$(docker create --platform linux/amd64 "$img")
            docker cp "$id":/boot/vmlinux ./vmlinux
            docker rm "$id"
            timeout 60 qemu-system-mips -M malta -kernel vmlinux \
              -append "console=ttyS0" -m 64M -nographic -no-reboot | tee boot.log || true
            grep -q "Unable to mount root fs" boot.log
            ;;
          esac
